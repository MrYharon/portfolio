<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#141414" rx="16"/>
  <rect x="2" y="2" width="796" height="356" fill="none" stroke="#262626" stroke-width="2" rx="14"/>

  <!-- Architecture Flow -->
  <g transform="translate(60, 60)">
    <!-- Node 1: DOM Mutation -->
    <rect x="0" y="70" width="180" height="100" rx="12" fill="#1f1f1f" stroke="#333333" stroke-width="1.5"/>
    <text x="90" y="110" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">DOM Observer</text>
    <text x="90" y="132" fill="#737373" font-family="monospace" font-size="11" text-anchor="middle">Keystroke interception</text>

    <!-- Arrow 1 -->
    <path d="M 185 120 L 245 120" stroke="#525252" stroke-width="2" stroke-dasharray="4"/>
    <polygon points="245,116 255,120 245,124" fill="#525252"/>

    <!-- Node 2: Local Heuristics -->
    <rect x="260" y="50" width="200" height="140" rx="14" fill="#000000" stroke="#525252" stroke-width="2"/>
    <text x="360" y="95" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">100% Local Engine</text>
    <text x="360" y="120" fill="#a3a3a3" font-family="monospace" font-size="11" text-anchor="middle">Regex Action Verbs</text>
    <text x="360" y="140" fill="#a3a3a3" font-family="monospace" font-size="11" text-anchor="middle">Constraint Heuristics</text>
    <text x="360" y="165" fill="#737373" font-family="monospace" font-size="10" text-anchor="middle">0ms Network Latency</text>

    <!-- Arrow 2 -->
    <path d="M 465 120 L 525 120" stroke="#525252" stroke-width="2" stroke-dasharray="4"/>
    <polygon points="525,116 535,120 525,124" fill="#525252"/>

    <!-- Node 3: UI Capsule -->
    <rect x="540" y="70" width="180" height="100" rx="12" fill="#1f1f1f" stroke="#333333" stroke-width="1.5"/>
    <text x="630" y="110" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Floating Capsule</text>
    <text x="630" y="132" fill="#737373" font-family="monospace" font-size="11" text-anchor="middle">Live Score & Alt+E</text>
  </g>
</svg>
